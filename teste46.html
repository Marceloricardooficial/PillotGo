        @keyframes estFadeBg { from { opacity: 0; } to { opacity: 1; } }

            width: 0;
            height: 0;
        }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(255, 255, 255, 0.1);
            transition: .3s;
            border-radius: 24px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: rgba(255, 255, 255, 0.3);
            transition: .3s;
            border-radius: 50%;

        window.baixarBackup = async () => {
            try {
                const hoje = new Date().toISOString().split('T')[0];
                const nomeArquivo = `backup-financeiro-${hoje}.json`;
                const conteudo = JSON.stringify({ versaoBackup: 1, geradoEm: new Date().toISOString(), dados: state.dados }, null, 2);
                const blob = new Blob([conteudo], { type: 'application/json' });
                const arquivo = new File([blob], nomeArquivo, { type: 'application/json' });

                // No celular abre o menu de compartilhar (salvar em Arquivos, Drive, WhatsApp...)
                if (navigator.canShare && navigator.canShare({ files: [arquivo] })) {
                    try {
                        await navigator.share({ files: [arquivo], title: 'Backup Financeiro' });
                        mostrarToastSalvamento('sucesso', 'Backup gerado');
                        return;
                    } catch (err) {
                        if (err?.name === 'AbortError') return;
                    }
                }

                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url; a.download = nomeArquivo;
                document.body.appendChild(a); a.click(); a.remove();
                setTimeout(() => URL.revokeObjectURL(url), 2000);
                mostrarToastSalvamento('sucesso', 'Backup baixado');
            } catch (e) {
                console.error('Erro no backup:', e);
                mostrarToastSalvamento('erro', 'Não consegui gerar o backup');

        };

        // Função para obter notificações de esquecimento (antiga "Lembrete" agora "Verificar")
        function getNotificacoesVerificar() {
            const notificacoes = [];
            const hoje = new Date();
            const mesSelecionado = state.verificarMes;
            const anoSelecionado = state.verificarAno;
            
            // Função para verificar se existe lançamento no mês selecionado
            const temLancamentoNoMes = (id, tipo) => {
                return state.dados.contas.some(c => {
                    const dataConta = new Date(c.data + 'T12:00:00');
                    const mesConta = dataConta.getMonth();
                    const anoConta = dataConta.getFullYear();
                    
                    // Verificar se a conta pertence ao item (cartão ou fixa)
                    if (tipo === 'cartao' && c.cartaoId !== id) return false;
                    if (tipo === 'fixa' && c.fixaId !== id) return false;
                    
                    // Verificar se está no mês selecionado
                    return (mesConta === mesSelecionado && anoConta === anoSelecionado);
                });
            };
            
            // Verificar cartões com lembrete ativado
            (state.dados.cartoes || []).forEach(cartao => {
                if (cartao.lembrarSemLancamento && !temLancamentoNoMes(cartao.id, 'cartao')) {
                    const mesNome = new Date(anoSelecionado, mesSelecionado).toLocaleDateString('pt-br', { month: 'long' });
                    notificacoes.push({
                        tipo: 'verificar',
                        origem: 'cartao',
                        id: cartao.id,
                        nome: cartao.banco,
                        imagem: cartao.imagem,
                        mensagem: `Acho que você esqueceu de mim em ${mesNome.charAt(0).toUpperCase() + mesNome.slice(1)}/${anoSelecionado}`,
                        cor: cartao.cor?.hex || '#1A1A1A'
                    });
                }
            });
            
            // Verificar contas fixas com lembrete ativado
            (state.dados.fixas || []).forEach(fixa => {
                if (fixa.lembrarSemLancamento && !temLancamentoNoMes(fixa.id, 'fixa')) {
                    const mesNome = new Date(anoSelecionado, mesSelecionado).toLocaleDateString('pt-br', { month: 'long' });
                    notificacoes.push({
                        tipo: 'verificar',
                        origem: 'fixa',
                        id: fixa.id,
                        nome: fixa.nome,
                        imagem: fixa.imagem,
                        mensagem: `Acho que você esqueceu de mim em ${mesNome.charAt(0).toUpperCase() + mesNome.slice(1)}/${anoSelecionado}`,
                        cor: '#000000'
                    });
                }
            });
            
            return notificacoes;
        }

        window.abrirConfirmarLancarRepetir = (origem, id) => {
            const contasDoItem = (state.dados.contas || []).filter(c => origem === 'cartao' ? c.cartaoId === id : c.fixaId === id);
            if (contasDoItem.length === 0) {
                alert('Nenhum lançamento anterior encontrado para repetir.');
                return;
            }
            const ultimaConta = [...contasDoItem].sort((a, b) => new Date(b.data) - new Date(a.data))[0];

            const itemCadastro = origem === 'cartao'
                ? state.dados.cartoes.find(x => x.id === id)
                : state.dados.fixas.find(x => x.id === id);
            const diaCadastrado = origem === 'cartao' ? itemCadastro?.diaFatura : itemCadastro?.diaVencimento;
            const diaOriginal = diaCadastrado || new Date(ultimaConta.data + 'T12:00:00').getDate();

            const ano = state.verificarAno;
            const mes = state.verificarMes;
            const ultimoDiaDoMes = new Date(ano, mes + 1, 0).getDate();
            const diaFinal = Math.min(diaOriginal, ultimoDiaDoMes);
            const novaData = `${ano}-${String(mes + 1).padStart(2, '0')}-${String(diaFinal).padStart(2, '0')}`;

        function getSemana2026(dataStr) {
            let d = new Date(dataStr + 'T12:00:00');
            
            // Ajustar finais de semana para a próxima segunda-feira
            const dayOfWeek = d.getDay(); 
            if (dayOfWeek === 6) {
                d.setDate(d.getDate() + 2); 
            } else if (dayOfWeek === 0) {
                d.setDate(d.getDate() + 1); 
            }
            
            const mes = d.getMonth();
            const starts = GABARITO_2026[mes] || [1, 8, 15, 22];
            let semanaEncontrada = 1;
            for (let i = 0; i < starts.length; i++) {
                if (d.getDate() >= starts[i]) semanaEncontrada = i + 1;
            }
            return semanaEncontrada;
        }

        function getDespesasDiariasFiltradas() {
            let despesas = state.dados.contas.filter(c => c.tipo === 'despesa_diaria');
            
            // Aplicar filtro de datas
            if (state.gastosFiltroDataInicio) {
                despesas = despesas.filter(c => c.data >= state.gastosFiltroDataInicio);
            }
            if (state.gastosFiltroDataFim) {
                despesas = despesas.filter(c => c.data <= state.gastosFiltroDataFim);
            }
            
            // Aplicar filtro de subcategoria

                despesas = despesas.filter(c => c.subcategoriaId === state.gastosFiltroSubcategoria);
            }
            
            return despesas;
        }

        function getTotaisPorSubcategoria() {
            const despesasFiltradas = getDespesasDiariasFiltradas();
            const totais = {};
            
            // Inicializar todas as subcategorias com total 0
            state.dados.subcategoriasGastos.forEach(sub => {
                totais[sub.id] = {
                    subcategoria: sub,
                    total: 0,
                    quantidade: 0
                };
            });
            
            // Somar valores
            despesasFiltradas.forEach(despesa => {
                if (despesa.subcategoriaId && totais[despesa.subcategoriaId]) {
                    totais[despesa.subcategoriaId].total += despesa.valor;
                    totais[despesa.subcategoriaId].quantidade++;
                }
            });
            
            // Converter para array e ordenar por total (decrescente)
            return Object.values(totais)
                .filter(item => item.total > 0 || state.gastosFiltroSubcategoria === 'todas')
                .sort((a, b) => b.total - a.total);
        }

        function getFilteredRelatorioData() {
            // Contas regulares (excluindo despesas diárias)
            const todasAsContas = (state.dados.contas || []).filter(c => c.tipo !== 'despesa_diaria');
            const contasNoPeriodo = todasAsContas.filter(c => c.data >= state.relFiltroDataInicio && c.data <= state.relFiltroDataFim);
            
            // Despesas diárias no período (apenas pagas)
            const despesasDiarias = (state.dados.contas || []).filter(c => 
                c.tipo === 'despesa_diaria' && 
                c.pago === true &&
                c.data >= state.relFiltroDataInicio && 
                c.data <= state.relFiltroDataFim
            );
            
            // TOTAL GERAL: Soma das contas regulares + despesas diárias pagas
            const totalContasRegulares = contasNoPeriodo.reduce((a, b) => a + b.valor, 0);
            const totalDespesasDiarias = despesasDiarias.reduce((a, b) => a + b.valor, 0);
            const totalGeral = totalContasRegulares + totalDespesasDiarias;
            
            const percentualDespesasDiarias = totalGeral > 0 ? ((totalDespesasDiarias / totalGeral) * 100).toFixed(1) : 0;

            const catMap = contasNoPeriodo.reduce((acc, c) => {
                const catId = c.categoria || 'outros';
                if (!acc[catId]) acc[catId] = [];
                acc[catId].push(c);
                return acc;
            }, {});

            const resumoCategorias = Object.keys(catMap).map(cid => {
                const info = CATEGORIAS.find(cx => cx.id === cid) || CATEGORIAS.find(cx => cx.id === 'outros');
                const total = catMap[cid].reduce((a, b) => a + b.valor, 0);
                return { 
                    id: cid, 
                    nome: info.nome, 
                    icone: info.icone, 
                    cor: info.cor, 
                    total, 
                    count: catMap[cid].length,
                    percentual: totalGeral > 0 ? ((total / totalGeral) * 100).toFixed(1) : 0,
                    itens: catMap[cid].sort((a,b) => b.data.localeCompare(a.data))
                };
            }).sort((a, b) => b.total - a.total);

            const cartoesNoPeriodo = contasNoPeriodo.filter(c => c.cartaoId);
            const totalCartoes = cartoesNoPeriodo.reduce((a, b) => a + b.valor, 0);
            const cartoesMap = cartoesNoPeriodo.reduce((acc, c) => {
                if (!acc[c.cartaoId]) acc[c.cartaoId] = { total: 0, count: 0 };
                acc[c.cartaoId].total += c.valor;
                acc[c.cartaoId].count++;
                return acc;
            }, {});

            const idsCartoes = [...new Set([...(state.dados.cartoes || []).map(c => c.id), ...Object.keys(cartoesMap)])];
            const resumoCartoes = idsCartoes.map(cid => {
                const info = state.dados.cartoes.find(cx => cx.id === cid);
                const total = cartoesMap[cid]?.total || 0;
                return {
                    id: cid,
                    nome: info?.banco || 'Cartão excluído',
                    titular: info?.titular || '',
                    cor: info?.cor?.hex || '#1A1A1A',
                    total,
                    semLancamento: total === 0,
                    percentual: totalCartoes > 0 ? ((total / totalCartoes) * 100).toFixed(1) : 0
                };
            }).sort((a, b) => b.total - a.total);

            // ---- Gráfico: despesas totais dos últimos 6 meses (até o mês da data "Fim") ----
            let fimRef = new Date((state.relFiltroDataFim || '') + 'T12:00:00');
            if (isNaN(fimRef)) fimRef = new Date();
            const CORES_GRAFICO_MESES = ['#8A05BE', '#2196F3', '#00BCD4', '#11C76F', '#FF9800', '#E91E63'];
            const mesesGrafico = [];
            for (let i = 5; i >= 0; i--) {
                const d = new Date(fimRef.getFullYear(), fimRef.getMonth() - i, 1);
                const chave = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
                const total = (state.dados.contas || [])
                    .filter(c => c.data && c.data.startsWith(chave) && (c.tipo !== 'despesa_diaria' || c.pago))
                    .reduce((a, b) => a + (b.valor || 0), 0);
                mesesGrafico.push({
                    chave,
                    label: d.toLocaleString('pt-br', { month: 'short' }).replace('.', '').toUpperCase(),
                    ano: String(d.getFullYear()).slice(2),
                    total,
                    cor: CORES_GRAFICO_MESES[5 - i]
                });
            }

            const insights = [];
            if (totalGeral > 0) {
                const topCat = resumoCategorias[0];
                insights.push(`A categoria <b>${topCat.nome}</b> domina seus gastos com R$ ${topCat.total.toLocaleString('pt-br')}.`);
                const percCartao = totalGeral > 0 ? ((totalCartoes / totalGeral) * 100).toFixed(0) : 0;
                insights.push(`Cartões de crédito representam <b>${percCartao}%</b> do total no período.`);
                if (resumoCartoes.length > 0) {
                    insights.push(`O cartão <b>${resumoCartoes[0].nome}</b> é o seu principal meio de pagamento atual.`);
                }
                const mesesMap = contasNoPeriodo.reduce((acc, c) => {
                    const m = c.data.substring(0, 7);
                    acc[m] = (acc[m] || 0) + c.valor;
                    return acc;
                }, {});
                const topMes = Object.keys(mesesMap).sort((a,b) => mesesMap[b] - mesesMap[a])[0];
                const mesNome = new Date(topMes + '-01T12:00:00').toLocaleString('pt-br', { month: 'long', year: 'numeric' });
                insights.push(`<b>${mesNome}</b> registrou o pico de despesas neste intervalo.`);
                const totalFixas = contasNoPeriodo.filter(c => c.fixaId).reduce((a,b) => a + b.valor, 0);
                insights.push(`Suas contas fixas consomem <b>${((totalFixas / totalGeral) * 100).toFixed(0)}%</b> do orçamento.`);
                const gastoCompras = resumoCategorias.find(c => c.id === 'compras')?.total || 0;
                insights.push(gastoCompras > 0 ? `Você gastou R$ ${gastoCompras.toLocaleString('pt-br')} em <b>Compras</b> manuais.` : `Nenhum gasto registrado em <b>Compras</b> no período.`);
            } else {
                insights.push("Selecione um período com dados para gerar insights.");
            }

            return { 
                totalGeral, 
                resumoCategorias, 
                insights, 
                totalCartoes, 
                resumoCartoes,
                mesesGrafico,
                pagosPorUsuario: (() => {
                    const mapa = {};
                    (state.dados.contas || []).forEach(c => {
                        (c.historicoPagamentos || []).forEach(p => {
                            const dia = diaDoPagamento(c, p);
                            if (!dia || dia < state.relFiltroDataInicio || dia > state.relFiltroDataFim) return;
                            const chave = (p.pagoPorId && p.pagoPorId !== 'nao_informado') ? p.pagoPorId : 'sem';
                            if (!mapa[chave]) {
                                const u = (state.dados.usuarios || []).find(x => x.id === p.pagoPorId);
                                mapa[chave] = { id: chave, nome: u?.nome || p.pagoPorNome || 'Não informado', thumbnail: u?.thumbnail || '', total: 0, qtd: 0 };
                            }
                            mapa[chave].total += p.valor || 0;
                            mapa[chave].qtd++;
                        });
                    });
                    const lista = Object.values(mapa).sort((a, b) => (a.id === 'sem') - (b.id === 'sem') || b.total - a.total);
                    const soma = lista.reduce((a, u) => a + u.total, 0);
                    return { lista, soma };
                })(),
                totalDespesasDiarias,
                percentualDespesasDiarias,
                despesasDiarias
            };
        }

                                            <button onclick="confirmDeleteUsuario('${u.id}')" class="w-9 h-9 rounded-xl bg-black flex items-center justify-center"><i class="fa-solid fa-trash text-[9px] text-[#CCFF00]"></i></button>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                `;
            }
        }

        window.setAba = (aba) => { state.abaAtiva = aba; state.modal = null; render(); };
        window.changeMonth = (val) => { state.dataNavegacao.setMonth(state.dataNavegacao.getMonth() + val); render(); };
        window.toggleSaldo = () => { state.verSaldo = !state.verSaldo; render(); };
        window.setSemana = (n) => { 
            if (n === 'all') state.semanasAtivas = [];
            else {
                const idx = state.semanasAtivas.indexOf(n);
                if (idx > -1) state.semanasAtivas.splice(idx, 1);
                else state.semanasAtivas.push(n);
            }
            render(); 
        };
        window.setFiltroStatus = (f) => { state.filtroStatus = f; render(); };
        window.setFiltroOrdem = (o) => { state.filtroOrdem = o; render(); };
        window.toggleFiltroDespesaDiaria = () => { 
            state.filtroDespesaDiaria = !state.filtroDespesaDiaria; 
            render(); 
        };
        window.closeModal = () => { state.modal = null; state.editando = null; state.tempImagem = null; state.passoLancamento = 'selecao'; state.itemSelecionadoId = ''; state.faturaFiltroIni = ''; state.faturaFiltroFim = ''; if (state.voltarDiarias) { state.voltarDiarias = false; state.modal = 'contasDiarias'; } render(); };
        window.openModalLancamento = () => { state.modal = 'lancamento'; state.passoLancamento = 'selecao'; render(); };
        window.setLancamentoTipo = (tipo) => { 
            state.tipoLancamento = tipo; 
            state.passoLancamento = 'formulario'; 
            // Definir categoria padrão para despesa diária
            if (tipo === 'despesa_diaria') {
                state.catSelecionada = 'despesa_diaria';
            }
            render(); 
        };
        window.backLancamento = () => { if (state.editando) closeModal(); else { state.passoLancamento = 'selecao'; render(); } };
        
        window.updateItemSelection = (id) => { 
            state.itemSelecionadoId = id; 
            if (state.tipoLancamento === 'fixa') {
                const f = state.dados.fixas.find(x => x.id === id);
                if (f && f.imagem) state.tempImagem = f.imagem;
                if (f && f.categoria) state.catSelecionada = f.categoria;
            } else if (state.tipoLancamento === 'cartao') {
                const c = state.dados.cartoes.find(x => x.id === id);
                if (c && c.imagem) state.tempImagem = c.imagem; 
                state.catSelecionada = 'cartao_credito';
            }
            render(); 
        };

        // Imagem da conta: usa a própria (contas variáveis) ou a do cadastro do cartão/fixa (sem copiar pro banco)
        window.getImagemConta = (c) => {
            if (!c) return null;
            if (c.cartaoId) { const cx = (state.dados.cartoes || []).find(x => x.id === c.cartaoId); if (cx?.imagem) return cx.imagem; }
            if (c.fixaId) { const fx = (state.dados.fixas || []).find(x => x.id === c.fixaId); if (fx?.imagem) return fx.imagem; }
            if (c.imagem) return c.imagem;
            if (c.grupoId) {
                const irmao = (state.dados.contas || []).find(x => x.grupoId === c.grupoId && x.imagem);
                if (irmao) return irmao.imagem;
            }
            return null;
        };

        // ================= ESTATÍSTICAS POR USUÁRIO =================
        const EST_DIAS = ['SEG', 'TER', 'QUA', 'QUI', 'SEX', 'SÁB', 'DOM'];
        const EST_DIAS_NOME = ['Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado', 'Domingo'];
        const EST_MESES = ['JAN', 'FEV', 'MAR', 'ABR', 'MAI', 'JUN', 'JUL', 'AGO', 'SET', 'OUT', 'NOV', 'DEZ'];
        const EST_MESES_NOME = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
        const EST_CORES_USUARIOS = ['#CCFF00', '#B388FF', '#4FC3F7', '#FF8A65', '#F06292', '#81C784'];
        const estFmt = (v) => (v || 0).toLocaleString('pt-br', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        const estAbrev = (v) => v >= 1000 ? (v / 1000).toLocaleString('pt-br', { maximumFractionDigits: 1 }) + 'k' : Math.round(v).toString();
        const estEsc = (t) => String(t ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        const estSoma = (arr) => arr.reduce((a, x) => a + x.valor, 0);

        // Data (no horário do Brasil) que conta para um pagamento — MESMA regra no relatório e no painel:
        // despesa diária = dia da despesa; demais contas = dia em que a baixa foi dada
        function diaLocal(d) {
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        }
        function diaDoPagamento(c, p) {
            if (c.tipo === 'despesa_diaria' && c.data) return c.data;
            const d = new Date(p.data);
            return isNaN(d) ? '' : diaLocal(d);
        }

        function estColetarPagamentos() {
            const lista = [];
            (state.dados.contas || []).forEach(c => {
                (c.historicoPagamentos || []).forEach(p => {
                    const dia = diaDoPagamento(c, p);
                    if (!dia) return;
                    const data = new Date(dia + 'T12:00:00');
                    const uid = (p.pagoPorId && p.pagoPorId !== 'nao_informado') ? p.pagoPorId : 'sem';
                    lista.push({ valor: Number(p.valor) || 0, data, uid, conta: c });
                });
            });
            return lista;
        }

        function estPeriodo(periodo, offset) {
            const hoje = new Date();
            const curto = (d) => `${String(d.getDate()).padStart(2, '0')} ${EST_MESES_NOME[d.getMonth()].slice(0, 3)}`;
            if (periodo === 'semana') {
                const ini = new Date(hoje.getFullYear(), hoje.getMonth(), hoje.getDate());
                ini.setDate(ini.getDate() - ((ini.getDay() + 6) % 7) + offset * 7);
                const fim = new Date(ini); fim.setDate(fim.getDate() + 7);
                const ult = new Date(fim); ult.setDate(ult.getDate() - 1);
                return { ini, fim, titulo: offset === 0 ? 'Esta semana' : offset === -1 ? 'Semana passada' : 'Semana', sub: `${curto(ini)} — ${curto(ult)}`, anterior: 'na semana anterior', nesse: 'nessa semana' };
            }
            if (periodo === 'mes') {
                const ini = new Date(hoje.getFullYear(), hoje.getMonth() + offset, 1);
                const fim = new Date(ini.getFullYear(), ini.getMonth() + 1, 1);
                return { ini, fim, titulo: offset === 0 ? 'Este mês' : offset === -1 ? 'Mês passado' : EST_MESES_NOME[ini.getMonth()], sub: `${EST_MESES_NOME[ini.getMonth()]} ${ini.getFullYear()}`, anterior: 'no mês anterior', nesse: 'nesse mês' };
            }
            const ini = new Date(hoje.getFullYear() + offset, 0, 1);
            const fim = new Date(ini.getFullYear() + 1, 0, 1);
            return { ini, fim, titulo: offset === 0 ? 'Este ano' : offset === -1 ? 'Ano passado' : 'Ano', sub: String(ini.getFullYear()), anterior: 'no ano anterior', nesse: 'nesse ano' };
        }

        function estBuckets(periodo, ini, fim) {
            if (periodo === 'semana') {
                return EST_DIAS.map((label, i) => {
                    const a = new Date(ini); a.setDate(a.getDate() + i);
                    const b = new Date(a); b.setDate(b.getDate() + 1);
                    return { label, sub: String(a.getDate()).padStart(2, '0'), nome: EST_DIAS_NOME[i], ini: a, fim: b };
                });
            }
            if (periodo === 'mes') {
                const out = [];
                const ultimoDia = new Date(fim.getTime() - 1).getDate();
                for (let d = 1; d <= ultimoDia; d += 7) {
                    const ate = Math.min(d + 6, ultimoDia);
                    out.push({ label: `S${out.length + 1}`, sub: `${d}-${ate}`, nome: `${out.length + 1}ª semana`, ini: new Date(ini.getFullYear(), ini.getMonth(), d), fim: new Date(ini.getFullYear(), ini.getMonth(), ate + 1) });
                }
                return out;
            }
            return EST_MESES.map((label, i) => ({ label, sub: '', nome: EST_MESES_NOME[i], ini: new Date(ini.getFullYear(), i, 1), fim: new Date(ini.getFullYear(), i + 1, 1) }));
        }

        function estCalcular() {
            const uid = state.estatUsuarioId;
            const periodo = state.estatPeriodo;
            const P = estPeriodo(periodo, state.estatOffset);
            const Pant = estPeriodo(periodo, state.estatOffset - 1);
            const hoje = new Date();
            const todos = estColetarPagamentos();
            const noPeriodo = todos.filter(x => x.data >= P.ini && x.data < P.fim);
            const meus = noPeriodo.filter(x => x.uid === uid);
            const total = estSoma(meus);
            const totalAnt = estSoma(todos.filter(x => x.uid === uid && x.data >= Pant.ini && x.data < Pant.fim));
            const totalCasa = estSoma(noPeriodo);

            const buckets = estBuckets(periodo, P.ini, P.fim).map(b => ({
                ...b,
                total: estSoma(meus.filter(x => x.data >= b.ini && x.data < b.fim)),
                atual: hoje >= b.ini && hoje < b.fim
            }));

            const catMapa = {};
            meus.forEach(x => {
                const id = x.conta.categoria || 'outros';
                if (!catMapa[id]) {
                    const cat = CATEGORIAS.find(c => c.id === id) || CATEGORIAS.find(c => c.id === 'outros');
                    catMapa[id] = { id, nome: cat.nome, icone: cat.icone, cor: cat.cor, total: 0 };
                }
                catMapa[id].total += x.valor;
            });
            const categorias = Object.values(catMapa).sort((a, b) => b.total - a.total);

            const maior = meus.reduce((m, x) => (!m || x.valor > m.valor) ? x : m, null);

            const usuarios = state.dados.usuarios || [];
            const porUsuario = usuarios.map((u, i) => ({ id: u.id, nome: u.nome, thumbnail: u.thumbnail, cor: EST_CORES_USUARIOS[i % EST_CORES_USUARIOS.length], total: estSoma(noPeriodo.filter(x => x.uid === u.id)) }));
            const semNome = estSoma(noPeriodo.filter(x => x.uid === 'sem'));
            if (semNome > 0) porUsuario.push({ id: 'sem', nome: 'Não informado', thumbnail: '', cor: '#6B7280', total: semNome });
            porUsuario.sort((a, b) => b.total - a.total);

            const recentes = [...meus].sort((a, b) => b.data - a.data).slice(0, 5);

            return { P, periodo, total, totalAnt, totalCasa, qtd: meus.length, media: meus.length ? total / meus.length : 0, maior, buckets, categorias, porUsuario, recentes };
        }

        function estInsights(d, quem) {
            const lista = [];
            if (d.qtd === 0) {
                lista.push({ icone: 'fa-mug-hot', cor: '#CCFF00', texto: `Nenhum pagamento de <b>${quem}</b> registrado ${d.P.nesse}.` });
                if (d.totalAnt > 0) lista.push({ icone: 'fa-clock-rotate-left', cor: '#4FC3F7', texto: `${d.P.anterior.charAt(0).toUpperCase() + d.P.anterior.slice(1)} foram <b>R$ ${estFmt(d.totalAnt)}</b>.` });
                return lista;
            }
            if (d.totalAnt > 0) {
                const pct = Math.round(((d.total - d.totalAnt) / d.totalAnt) * 100);
                if (pct === 0) lista.push({ icone: 'fa-equals', cor: '#4FC3F7', texto: `${quem} pagou <b>o mesmo valor</b> ${d.P.anterior}.` });
                else lista.push({ icone: pct > 0 ? 'fa-arrow-trend-up' : 'fa-arrow-trend-down', cor: pct > 0 ? '#FF8A65' : '#CCFF00', texto: `${quem} pagou <b>${Math.abs(pct)}% ${pct > 0 ? 'a mais' : 'a menos'}</b> que ${d.P.anterior}.` });
            } else {
                lista.push({ icone: 'fa-seedling', cor: '#81C784', texto: `Nenhum pagamento ${d.P.anterior} — tudo o que aparece aqui é novo.` });
            }
            if (d.maior) lista.push({ icone: 'fa-crown', cor: '#FFD54F', texto: `Maior pagamento: <b>${estEsc(d.maior.conta.nome)}</b> — R$ ${estFmt(d.maior.valor)}.` });
            const top = d.categorias[0];
            if (top && d.total > 0) lista.push({ icone: top.icone, cor: top.cor, texto: `<b>${estEsc(top.nome)}</b> levou ${Math.round((top.total / d.total) * 100)}% do que ${quem === 'Você' ? 'você' : quem} pagou.` });
            const pico = d.buckets.reduce((m, b) => b.total > (m?.total || 0) ? b : m, null);
            if (pico) {
                const txt = d.periodo === 'semana' ? `<b>${pico.nome}</b> foi o dia mais pesado` : d.periodo === 'mes' ? `A <b>${pico.nome}</b> concentrou mais pagamentos` : `<b>${pico.nome}</b> foi o mês mais pesado`;
                lista.push({ icone: 'fa-fire', cor: '#F06292', texto: `${txt} (R$ ${estFmt(pico.total)}).` });
            }
            if ((state.dados.usuarios || []).length > 1 && d.totalCasa > 0) {
                lista.push({ icone: 'fa-people-roof', cor: '#B388FF', texto: `${quem} cobriu <b>${Math.round((d.total / d.totalCasa) * 100)}%</b> de tudo o que foi pago em casa ${d.P.nesse}.` });
            }
            return lista;
        }

        function renderEstatisticasConteudo() {
            const d = estCalcular();
            const usuarios = state.dados.usuarios || [];
            const sel = usuarios.find(u => u.id === state.estatUsuarioId);
            const ehVoce = state.estatUsuarioId === state.currentUser?.id;
            const quem = ehVoce ? 'Você' : estEsc(sel?.nome || 'Usuário');
            const share = d.totalCasa > 0 ? d.total / d.totalCasa : 0;
            const R = 34, C = +(2 * Math.PI * R).toFixed(2);
            const maiorBucket = Math.max(...d.buckets.map(b => b.total), 0);
            const trendPct = d.totalAnt > 0 ? Math.round(((d.total - d.totalAnt) / d.totalAnt) * 100) : null;
            const nomesBarra = { semana: 'Pagamentos por dia', mes: 'Pagamentos por semana', ano: 'Pagamentos por mês' };
            const insights = estInsights(d, quem);
            const maxUsuario = Math.max(...d.porUsuario.map(u => u.total), 0);

            return `
                <div class="flex gap-5 overflow-x-auto no-scrollbar -mx-3 px-3 pt-2 pb-2 mb-3 est-up">
                    ${usuarios.map((u, i) => {
                        const ativo = u.id === state.estatUsuarioId;
                        const cor = EST_CORES_USUARIOS[i % EST_CORES_USUARIOS.length];
                        return `
                        <button onclick="setEstatUsuario('${u.id}')" class="flex flex-col items-center gap-2 flex-shrink-0 transition-all duration-300 ${ativo ? 'scale-105' : 'opacity-40 scale-95'}">
                            <div class="w-16 h-16 rounded-full p-[3px] transition-all" style="background:${ativo ? cor : 'rgba(255,255,255,0.1)'}; ${ativo ? `box-shadow:0 0 24px ${cor}55` : ''}">
                                <div class="w-full h-full rounded-full overflow-hidden bg-[#1A1A1A] border-[3px] border-[#0E0E0E] flex items-center justify-center">
                                    ${u.thumbnail ? `<img src="${u.thumbnail}" class="w-full h-full object-cover">` : `<i class="fa-solid fa-user text-white/30"></i>`}
                                </div>
                            </div>
                            <span class="text-[9px] font-black uppercase tracking-widest" style="color:${ativo ? cor : '#fff'}">${estEsc(u.nome)}${u.id === state.currentUser?.id ? ' · você' : ''}</span>
                        </button>`;
                    }).join('')}
                </div>

                <div class="grid grid-cols-3 bg-white/5 p-1 rounded-2xl mb-4 est-up" style="--d:.04s">
                    ${[['semana', 'Semanal'], ['mes', 'Mensal'], ['ano', 'Anual']].map(([v, txt]) => `
                        <button onclick="setEstatPeriodo('${v}')" class="py-2.5 rounded-xl text-[10px] font-black uppercase tracking-widest transition-all ${state.estatPeriodo === v ? 'bg-[#CCFF00] text-black shadow-lg' : 'text-white/40'}">${txt}</button>
                    `).join('')}
                </div>

                <div class="flex items-center justify-between mb-5 est-up" style="--d:.08s">
                    <button onclick="moverEstatPeriodo(-1)" class="w-9 h-9 rounded-full bg-white/5 text-white flex items-center justify-center active:scale-90"><i class="fa-solid fa-chevron-left text-[10px]"></i></button>
                    <div class="text-center">
                        <p class="text-white font-black uppercase text-[11px] tracking-[0.2em]">${d.P.titulo}</p>
                        <p class="text-white/30 text-[9px] font-bold mt-0.5">${d.P.sub}</p>
                    </div>
                    <button onclick="moverEstatPeriodo(1)" ${state.estatOffset >= 0 ? 'disabled' : ''} class="w-9 h-9 rounded-full bg-white/5 text-white flex items-center justify-center active:scale-90 ${state.estatOffset >= 0 ? 'opacity-20' : ''}"><i class="fa-solid fa-chevron-right text-[10px]"></i></button>
                </div>

                <div class="relative rounded-[32px] p-6 bg-[#CCFF00] overflow-hidden mb-3 est-up" style="--d:.12s">
                    <i class="fa-solid fa-chart-simple absolute -left-3 -bottom-8 text-[120px] text-black/[0.06] pointer-events-none"></i>
                    <div class="relative flex items-center justify-between gap-3">
                        <div class="min-w-0">
                            <p class="text-[9px] font-black uppercase tracking-widest text-black/50">${ehVoce ? 'Você pagou' : `${quem} pagou`}</p>
                            <h2 class="text-[30px] leading-none font-black tracking-tighter text-black mt-2 whitespace-nowrap"><span class="text-[13px]">R$ </span><span data-countup="${d.total}">0,00</span></h2>
                            ${trendPct !== null ? `
                                <div class="inline-flex items-center gap-1.5 mt-3 px-2.5 py-1 rounded-full bg-black text-[9px] font-black uppercase tracking-wide" style="color:${trendPct > 0 ? '#FF8A65' : '#CCFF00'}">
                                    <i class="fa-solid ${trendPct > 0 ? 'fa-arrow-up' : trendPct < 0 ? 'fa-arrow-down' : 'fa-equals'}"></i>${Math.abs(trendPct)}% <span class="text-white/50 normal-case font-bold">vs anterior</span>
                                </div>` : `<p class="text-[9px] font-bold text-black/40 mt-3">Sem dados do período anterior</p>`}
                        </div>
                        <div class="relative w-[88px] h-[88px] flex-shrink-0">
                            <svg viewBox="0 0 84 84" class="w-full h-full -rotate-90">
                                <circle cx="42" cy="42" r="${R}" fill="none" stroke="rgba(0,0,0,0.1)" stroke-width="9"/>
                                ${share > 0 ? `<circle class="est-ring" cx="42" cy="42" r="${R}" fill="none" stroke="#000" stroke-width="9" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${(C * (1 - share)).toFixed(2)}" style="--c:${C}"/>` : ''}
                            </svg>
                            <div class="absolute inset-0 flex flex-col items-center justify-center">
                                <span class="text-[16px] font-black text-black leading-none" data-countup="${share * 100}" data-tipo="pct">0%</span>
                                <span class="text-[6px] font-black uppercase text-black/50 tracking-widest mt-1">da casa</span>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="grid grid-cols-3 gap-2 mb-4">
                    ${[
                        { l: 'Pagamentos', v: d.qtd, tipo: 'int', ic: 'fa-receipt' },
                        { l: 'Média', v: d.media, tipo: 'moeda', ic: 'fa-scale-balanced' },
                        { l: 'Maior', v: d.maior?.valor || 0, tipo: 'moeda', ic: 'fa-crown' }
                    ].map((m, i) => `
                        <div class="rounded-[22px] bg-[#1A1A1A] border border-white/5 p-3 est-up" style="--d:${0.16 + i * 0.05}s">
                            <i class="fa-solid ${m.ic} text-[#CCFF00] text-[10px]"></i>
                            <p class="text-[7px] font-black uppercase tracking-widest text-white/30 mt-2">${m.l}</p>
                            <p class="text-white font-black text-[13px] mt-0.5 whitespace-nowrap">${m.tipo === 'moeda' ? '<span class="text-[8px]">R$ </span>' : ''}<span data-countup="${m.v}" data-tipo="${m.tipo}">0</span></p>
                        </div>
                    `).join('')}
                </div>

                <div class="rounded-[32px] bg-[#1A1A1A] border border-white/5 p-5 mb-4 est-up" style="--d:.28s">
                    <div class="flex items-center justify-between mb-5">
                        <h4 class="text-white font-black uppercase text-[10px] tracking-widest flex items-center gap-2"><i class="fa-solid fa-chart-column text-[#CCFF00]"></i> ${nomesBarra[d.periodo]}</h4>
                        <span class="text-[9px] font-black text-white/30">R$ ${estFmt(d.total)}</span>
                    </div>
                    <div class="flex items-end ${d.periodo === 'ano' ? 'gap-1' : 'gap-2'}" style="height:150px">
                        ${d.buckets.map((b, i) => {
                            const topo = maiorBucket > 0 && b.total === maiorBucket;
                            const h = b.total > 0 ? Math.max((b.total / maiorBucket) * 82, 6) : 3;
                            return `
                            <div class="flex-1 h-full flex flex-col items-center justify-end min-w-0">
                                <span class="text-[7px] font-black mb-1 ${topo ? 'text-[#CCFF00]' : 'text-white/35'}">${b.total > 0 ? estAbrev(b.total) : ''}</span>
                                <div class="w-full rounded-t-lg rounded-b-[4px] est-bar" style="--d:${(0.32 + i * 0.045).toFixed(3)}s; height:${h}%; background:${b.total > 0 ? (topo ? 'linear-gradient(180deg,#E6FF7A,#CCFF00)' : 'rgba(204,255,0,0.32)') : 'rgba(255,255,255,0.06)'}; ${topo ? 'box-shadow:0 0 18px rgba(204,255,0,0.35)' : ''}"></div>
                            </div>`;
                        }).join('')}
                    </div>
                    <div class="flex ${d.periodo === 'ano' ? 'gap-1' : 'gap-2'} mt-2 pt-2 border-t border-white/5">
                        ${d.buckets.map(b => `
                            <div class="flex-1 text-center min-w-0">
                                <span class="text-[7px] font-black block ${b.atual ? 'text-[#CCFF00]' : 'text-white/40'}">${b.label}</span>
                                ${b.sub ? `<span class="text-[6px] font-bold block text-white/20">${b.sub}</span>` : ''}
                                ${b.atual ? '<span class="block w-1 h-1 rounded-full bg-[#CCFF00] mx-auto mt-1"></span>' : ''}
                            </div>

            state.estatAberto = true;

            const dur = 1200;
            document.querySelectorAll('#est-conteudo [data-countup]').forEach(el => {
                const alvo = parseFloat(el.dataset.countup) || 0;
                const tipo = el.dataset.tipo || 'moeda';

                if (reduz) { el.textContent = formata(alvo); return; }
                const passo = (t) => {
                    const k = Math.min((t - t0) / dur, 1);
                    el.textContent = formata(alvo * (1 - Math.pow(1 - k, 3)));
                    if (k < 1) requestAnimationFrame(passo);
                };
                requestAnimationFrame(passo);
            });
        }

        const dataLocalISO = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;

        function calcularResumoSemana() {
            const agora = new Date();
            const hojeISO = dataLocalISO(agora);
            const ini = new Date(agora.getFullYear(), agora.getMonth(), agora.getDate());
            ini.setDate(ini.getDate() - ((ini.getDay() + 6) % 7));
            const dias = Array.from({ length: 7 }, (_, i) => { const d = new Date(ini); d.setDate(d.getDate() + i); return d; });
            const diasISO = dias.map(dataLocalISO);
            const iniISO = diasISO[0], fimISO = diasISO[6];
            const contas = state.dados.contas || [];
            const pagoDe = (c) => (c.historicoPagamentos || []).reduce((a, p) => a + (Number(p.valor) || 0), 0);
            const faltaDe = (c) => c.pago ? 0 : Math.max(0, (Number(c.valor) || 0) - pagoDe(c));

            // Contas que vencem nesta semana (sem despesas diárias)
            const daSemana = contas.filter(c => c.tipo !== 'despesa_diaria' && c.data >= iniISO && c.data <= fimISO);
            const totalSemana = daSemana.reduce((a, c) => a + (Number(c.valor) || 0), 0);
            const pendenteSemana = daSemana.reduce((a, c) => a + faltaDe(c), 0);
            const pagoSemana = Math.max(0, totalSemana - pendenteSemana);
            const pendentes = daSemana.filter(c => faltaDe(c) > 0);
            const pctPago = totalSemana > 0 ? (pagoSemana / totalSemana) * 100 : 0;

            const vencidas = contas.filter(c => c.tipo !== 'despesa_diaria' && c.data < hojeISO && faltaDe(c) > 0);
            const totalVencidas = vencidas.reduce((a, c) => a + faltaDe(c), 0);
            const proxima = contas.filter(c => c.tipo !== 'despesa_diaria' && c.data >= hojeISO && faltaDe(c) > 0).sort((a, b) => a.data.localeCompare(b.data))[0] || null;
            const venceHoje = contas.filter(c => c.tipo !== 'despesa_diaria' && c.data === hojeISO && faltaDe(c) > 0);

            const calendario = dias.map((d, i) => {
                const doDia = daSemana.filter(c => c.data === diasISO[i]);
                return { dia: d.getDate(), label: EST_DIAS[i], iso: diasISO[i], hoje: diasISO[i] === hojeISO, qtd: doDia.length, tudoPago: doDia.length > 0 && doDia.every(c => faltaDe(c) === 0), atrasada: diasISO[i] < hojeISO && doDia.some(c => faltaDe(c) > 0) };
            });

            // Despesas diárias
            const diarias = contas.filter(c => c.tipo === 'despesa_diaria');
            const diariasHoje = diarias.filter(c => c.data === hojeISO).sort((a, b) => (b.valor || 0) - (a.valor || 0));
            const gastoHoje = diariasHoje.reduce((a, c) => a + (Number(c.valor) || 0), 0);
            const diariasPorDia = diasISO.map(iso => diarias.filter(c => c.data === iso).reduce((a, c) => a + (Number(c.valor) || 0), 0));
            const gastoDiarioSemana = diariasPorDia.reduce((a, v) => a + v, 0);
            const idxHoje = diasISO.indexOf(hojeISO);
            const anteriores = diariasPorDia.slice(0, idxHoje);
            const mediaAnteriores = anteriores.length ? anteriores.reduce((a, v) => a + v, 0) / anteriores.length : 0;

            return { agora, hojeISO, iniISO, fimISO, dias, daSemana, totalSemana, pagoSemana, pendenteSemana, pendentes, pctPago, vencidas, totalVencidas, proxima, venceHoje, calendario, diariasHoje, gastoHoje, diariasPorDia, gastoDiarioSemana, mediaAnteriores, idxHoje };
        }

                            </div>

                            ${r.vencidas.length > 0 ? `
                                <div class="relative rounded-[28px] p-5 overflow-hidden mb-4 bg-[#E53935] ${up}" style="--d:.05s">

                                    <div>
                                        ${selHoje.itens.length ? `

                                                ${state.insightHojeExp ? 'Ver menos' : 'Ver mais'} <i class="fa-solid fa-chevron-${state.insightHojeExp ? 'up' : 'down'} text-[10px] text-[#CCFF00]"></i>
                                            </button>
                                            ${state.insightHojeExp ? `
                                                <div class="divide-y divide-white/5 mt-2">
                                                    ${selHoje.itens.map((c, i) => {
                                                        const sub = subcats.find(s => s.id === c.subcategoriaId) || SUBCATEGORIAS_PADRAO.find(s => s.id === c.subcategoriaId) || { nome: 'Despesa', icone: 'fa-receipt', cor: '#CCFF00' };
                                                        return `
                                                        <div class="flex items-center gap-3 py-3 est-up" style="--d:${(i * 0.05).toFixed(2)}s">
                                                            <div class="w-10 h-10 rounded-xl flex items-center justify-center flex-shrink-0" style="background:${sub.cor}26; color:${sub.cor}"><i class="fa-solid ${sub.icone} text-[13px]"></i></div>
                                                            <div class="flex-1 min-w-0">
                                                                <p class="text-white text-[14px] font-bold leading-snug break-words">${estEsc(c.descricao || c.nome)}</p>

                                                            <span class="text-white text-[14px] font-black whitespace-nowrap"><span class="text-[9px]">R$ </span>${estFmt(c.valor)}</span>

                                <button onclick="fecharInsightSemana(true)" class="py-2 text-white/30 font-black uppercase tracking-widest text-[10px]">Não mostrar mais hoje</button>
                            </div>

                    </div>
                </div>
            `;
        }

        // Abre uma vez por abertura do app (se não foi ocultado hoje)
        function verificarInsightAbertura() {
            if (state.insightVerificado || !state.isLogged || !state.dados) return;
            state.insightVerificado = true;
            let oculto = null;
            try { oculto = localStorage.getItem('financeiro_insight_oculto'); } catch (e) {}
            if (oculto === dataLocalISO(new Date())) return;
            if (state.modal) return;
            state.insightAnimado = false;
            state.insightFiltro = state.currentUser?.id || 'todos';
            state.insightHojeExp = false;
            state.insightSemanaSel = null;
            state.insightCompPeriodo = 'semana';
            state.insightCompOffset = 0;
            state.modal = 'insightSemana';
        }

        // Mantém a rolagem do modal ao trocar de pessoa / abrir detalhes
        function renderInsightMantendoScroll() {
            const box = document.getElementById('insight-conteudo');
            const y = box ? box.scrollTop : 0;
            render();
            const novo = document.getElementById('insight-conteudo');
            if (novo) novo.scrollTop = y;
        }
        window.abrirInsightSemana = () => { state.insightAnimado = false; state.insightFiltro = state.currentUser?.id || 'todos'; state.insightHojeExp = false; state.insightSemanaSel = null; state.insightCompPeriodo = 'semana'; state.insightCompOffset = 0; state.modal = 'insightSemana'; render(); };
        window.setInsightComp = (p) => { state.insightCompPeriodo = p; state.insightCompOffset = 0; state.insightSemanaSel = null; renderInsightMantendoScroll(); };
        window.moverInsightComp = (n) => { state.insightCompOffset = Math.min(0, (state.insightCompOffset || 0) + n); state.insightSemanaSel = null; renderInsightMantendoScroll(); };
        window.setInsightFiltro = (id) => { state.insightFiltro = id; renderInsightMantendoScroll(); };
        window.toggleInsightHojeExp = () => { state.insightHojeExp = !state.insightHojeExp; renderInsightMantendoScroll(); };
        window.setInsightSemanaSel = (id) => { state.insightSemanaSel = state.insightSemanaSel === id ? null : id; renderInsightMantendoScroll(); };
        window.fecharInsightSemana = (naoMostrarHoje) => {
            if (naoMostrarHoje) { try { localStorage.setItem('financeiro_insight_oculto', dataLocalISO(new Date())); } catch (e) {} }
            state.insightAnimado = false;
            closeModal();
        };
        window.insightLancarDespesa = () => {
            state.insightAnimado = false;
            state.modal = null;
            openModalLancamento();
            setLancamentoTipo('despesa_diaria');
        };


        // ================= MODAL "CONTAS DIÁRIAS" =================
        function diariasIntervalo() {
            if (state.diariasPeriodo === 'periodo') {
                const ini = state.diariasIni || diaLocal(new Date(new Date().getFullYear(), new Date().getMonth(), 1));
                const fim = state.diariasFim || diaLocal(new Date());
                const curto = (iso) => { const [y, m, d] = iso.split('-'); return `${d}/${m}/${y}`; };
                return { ini: ini <= fim ? ini : fim, fim: ini <= fim ? fim : ini, titulo: 'Período', sub: `${curto(ini <= fim ? ini : fim)} até ${curto(ini <= fim ? fim : ini)}` };
            }
            const P = estPeriodo(state.diariasPeriodo, state.diariasOffset);
            const ult = new Date(P.fim); ult.setDate(ult.getDate() - 1);
            return { ini: diaLocal(P.ini), fim: diaLocal(ult), titulo: P.titulo, sub: P.sub };
        }

        function diariasFiltradas() {
            const { ini, fim } = diariasIntervalo();
            const busca = normalizarTexto(state.diariasBusca);
            const u = state.diariasUsuario || 'todos';
            return (state.dados.contas || [])
                .filter(c => c.tipo === 'despesa_diaria' && c.data >= ini && c.data <= fim)
                .filter(c => {
                    if (u === 'todos') return true;
                    const pid = c.historicoPagamentos?.[0]?.pagoPorId || null;
                    if (u === 'sem') return !pid || pid === 'nao_informado';
                    return pid === u;
                })
                .filter(c => !busca || normalizarTexto(`${c.descricao || ''} ${c.nome || ''}`).includes(busca))
                .sort((a, b) => b.data.localeCompare(a.data) || (Number(b.id) || 0) - (Number(a.id) || 0));
        }

        function renderDiariasResultado() {
            const lista = diariasFiltradas();
            const total = lista.reduce((a, c) => a + (Number(c.valor) || 0), 0);
            const subcats = state.dados.subcategoriasGastos || SUBCATEGORIAS_PADRAO;
            const usuarios = state.dados.usuarios || [];
            const anima = !state.diariasAnimado;

            const grupos = [];
            lista.forEach(c => {
                let g = grupos[grupos.length - 1];
                if (!g || g.dia !== c.data) { g = { dia: c.data, itens: [], total: 0 }; grupos.push(g); }
                g.itens.push(c); g.total += Number(c.valor) || 0;
            });
            const hojeISO = diaLocal(new Date());
            const ontem = new Date(); ontem.setDate(ontem.getDate() - 1);
            const ontemISO = diaLocal(ontem);
            const nomeDia = (iso) => {
                const d = new Date(iso + 'T12:00:00');
                const base = d.toLocaleDateString('pt-br', { weekday: 'long', day: '2-digit', month: '2-digit' });
                return iso === hojeISO ? `Hoje · ${base}` : iso === ontemISO ? `Ontem · ${base}` : base;
            };
            const maior = lista.reduce((m, c) => (!m || (Number(c.valor) || 0) > (Number(m.valor) || 0)) ? c : m, null);
            const dias = new Set(lista.map(c => c.data)).size;

            return `
                <div class="relative rounded-[32px] p-6 bg-[#CCFF00] overflow-hidden mb-3 ${anima ? 'est-up' : ''}" style="--d:.1s">
                    <i class="fa-solid fa-receipt absolute -right-4 -bottom-8 text-[120px] text-black/[0.06] pointer-events-none"></i>
                    <p class="relative text-[10px] font-black uppercase tracking-widest text-black/50">Total gasto</p>
                    <h2 class="relative text-[34px] leading-none font-black tracking-tighter text-black mt-2 whitespace-nowrap"><span class="text-[14px]">R$ </span>${estFmt(total)}</h2>
                </div>

                <div class="grid grid-cols-3 gap-2 mb-6">
                    ${[
                        { l: 'Lançamentos', v: String(lista.length), ic: 'fa-receipt' },
                        { l: 'Média/dia', v: `<span class="text-[9px]">R$ </span>${estFmt(dias ? total / dias : 0)}`, ic: 'fa-scale-balanced' },
                        { l: 'Maior', v: `<span class="text-[9px]">R$ </span>${estFmt(maior?.valor || 0)}`, ic: 'fa-crown' }
                    ].map((m, i) => `
                        <div class="rounded-[22px] bg-[#1A1A1A] border border-white/5 p-3 ${anima ? 'est-up' : ''}" style="--d:${(0.14 + i * 0.05).toFixed(2)}s">
                            <i class="fa-solid ${m.ic} text-[#CCFF00] text-[11px]"></i>
                            <p class="text-[8px] font-black uppercase tracking-widest text-white/35 mt-2">${m.l}</p>
                            <p class="text-white font-black text-[14px] mt-0.5 whitespace-nowrap">${m.v}</p>
                        </div>
                    `).join('')}
                </div>

                ${grupos.length ? grupos.map((g, gi) => `
                    <div class="mb-5 ${anima ? 'est-up' : ''}" style="--d:${Math.min(0.3 + gi * 0.06, 0.7).toFixed(2)}s">
                        <div class="flex items-center justify-between mb-2.5 px-1">
                            <span class="text-white/70 text-[13px] font-semibold first-letter:uppercase">${nomeDia(g.dia)}</span>
                            <span class="text-[#CCFF00] text-[13px] font-black">R$ ${estFmt(g.total)}</span>
                        </div>
                        <div class="rounded-[28px] bg-[#1A1A1A] border border-white/5 divide-y divide-white/5 overflow-hidden">
                            ${g.itens.map(c => {
                                const sub = subcats.find(s => s.id === c.subcategoriaId) || SUBCATEGORIAS_PADRAO.find(s => s.id === c.subcategoriaId) || { nome: 'Despesa', icone: 'fa-receipt', cor: '#CCFF00' };
                                const pg = c.historicoPagamentos?.[0];
                                const uPag = usuarios.find(x => x.id === pg?.pagoPorId);
                                const quem = uPag?.nome || (pg?.pagoPorId === 'nao_informado' ? 'Não informado' : pg?.pagoPorNome) || 'Não informado';
                                return `
                                <div class="flex items-center gap-3 p-4">
                                    <div class="w-12 h-12 rounded-2xl flex items-center justify-center flex-shrink-0" style="background:${sub.cor}26; color:${sub.cor}"><i class="fa-solid ${sub.icone} text-[15px]"></i></div>
                                    <div class="flex-1 min-w-0">
                                        <p class="text-white text-[16px] font-bold leading-snug break-words">${estEsc(c.descricao || c.nome)}</p>
                                        <p class="text-[#CCFF00] text-[16px] font-black mt-0.5"><span class="text-[10px]">R$ </span>${estFmt(c.valor)}</p>
                                        <div class="flex flex-wrap items-center gap-x-1.5 gap-y-1 mt-1.5 text-white/45 text-[13px] min-w-0">
                                            <span>${estEsc(sub.nome)}</span>
                                            <span class="text-white/20">·</span>

            const diaConta = String(dataConta.getDate()).padStart(2, '0');
            
            return `

            if (state.modal === 'usuario') {

                                        return `

            if (state.modal === 'confirmarLancarRepetir') {

                return `
                    <div class="fixed inset-0 bg-black/60 backdrop-blur-sm z-[999] flex items-center justify-center p-6 animate-in">
                        <form onsubmit="handleConfirmarLancarRepetir(event)" class="w-full max-w-[300px] bg-black border border-[#CCFF00] rounded-[32px] flex flex-col items-center p-6 shadow-[0_0_50px_rgba(204,255,0,0.2)]">
                            <div class="w-16 h-16 rounded-full flex items-center justify-center mb-4 text-[#CCFF00]">

            if (state.modal === 'excluir') {
                return `
