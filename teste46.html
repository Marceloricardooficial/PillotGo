        function renderFeedback() {
            if (!state.feedback.ativo) return '';
            return `
                <div class="fixed inset-0 bg-black/90 z-[1000] flex items-center justify-center p-10 backdrop-blur-md">
                    <div class="bg-[#1A1A1A] w-full max-sm rounded-[45px] p-10 border border-[#CCFF00]/30 text-center animate-in">
                        <div class="w-20 h-20 bg-[#CCFF00] rounded-full flex items-center justify-center mb-8 mx-auto"><i class="fa-solid fa-check text-black text-3xl"></i></div>
                        <h4 class="text-[#CCFF00] font-black uppercase text-xs tracking-widest mb-4">Sucesso!</h4>
                        <p class="text-white/50 text-xs italic">"${state.feedback.frase}"</p>
                    </div>
                </div>
            `;
        }

        function calculateStats() {
            let filtrada = (state.dados.contas || []).filter(c => {
                const d = new Date(c.data + 'T12:00:00');
                return d.getMonth() === state.dataNavegacao.getMonth() && d.getFullYear() === state.dataNavegacao.getFullYear();
            });
            
            // Aplicar filtro de despesas diárias
            if (state.filtroDespesaDiaria) {
                filtrada = filtrada.filter(c => c.tipo === 'despesa_diaria');
            } else {
                // Não mostrar despesas diárias no filtro padrão (conforme especificação)
                filtrada = filtrada.filter(c => c.tipo !== 'despesa_diaria');
            }
            
            if (state.semanasAtivas.length) {
                filtrada = filtrada.filter(c => {
                    return state.semanasAtivas.includes(getSemana2026(c.data));
                });
            }
            
            const proc = filtrada.map(c => {
                const pago = (c.historicoPagamentos || []).reduce((a, b) => a + b.valor, 0);
                return { ...c, totalPago: pago, faltaPagar: Math.max(0, c.valor - pago) };
            });
            let listaFinal = [...proc];
            if (state.filtroStatus === 'pagos') listaFinal = listaFinal.filter(c => c.pago);
            if (state.filtroStatus === 'pendentes') listaFinal = listaFinal.filter(c => !c.pago);
            
            if (state.filtroOrdem === 'valor') {
                listaFinal.sort((a, b) => b.faltaPagar - a.faltaPagar);
            } else {
                listaFinal.sort((a, b) => new Date(a.data).getTime() - new Date(b.data).getTime());
            }

            return {
                lista: listaFinal,
                pendente: proc.reduce((a, b) => a + b.faltaPagar, 0),
                pago: proc.reduce((a, b) => a + b.totalPago, 0),
                qtd: proc.length
            };
        }

        function calculateFaturasInfo(isFixa) {
            const item = state.editando;
            let filtradas = state.dados.contas.filter(c => isFixa ? c.fixaId === item.id : c.cartaoId === item.id);
            if (state.faturaFiltroIni && state.faturaFiltroFim) {
                filtradas = filtradas.filter(c => c.data >= state.faturaFiltroIni && c.data <= state.faturaFiltroFim);
            }
            const totalGeral = filtradas.reduce((a, b) => a + b.valor, 0);
            const agrupado = filtradas.reduce((acc, c) => {
                const mesKey = c.data.substring(0, 7);
                if (!acc[mesKey]) acc[mesKey] = { mes: mesKey, total: 0, itens: [] };
                acc[mesKey].total += c.valor;
                acc[mesKey].itens.push(c);
                return acc;
            }, {});
            return { agrupado: Object.values(agrupado).sort((a, b) => b.mes.localeCompare(a.mes)), totalGeral, qtdItens: filtradas.length };
        }

        window.setCat = (id) => { state.catSelecionada = id; render(); };
        window.toggleExpandFatura = (id) => { const el = document.getElementById(`fatura-detalhe-${id}`); if(el) el.classList.toggle('hidden'); }
        window.openFaturas = (id) => { state.editando = state.dados.cartoes.find(x => x.id === id); state.modal = 'faturas'; render(); };
        window.openFaturasFixas = (id) => { state.editando = state.dados.fixas.find(x => x.id === id); state.modal = 'faturas'; render(); };

        window.aplicarFiltroFaturas = () => {
            state.faturaFiltroIni = document.getElementById('fatura-data-ini').value;
            state.faturaFiltroFim = document.getElementById('fatura-data-fim').value;
            render();
        };

        window.handleSalvarConta = async (e) => {
            e.preventDefault();
            const f = new FormData(e.target);
            const frequencia = state.editando ? 'mensal' : (f.get('frequencia') || 'mensal');
            const diasSemana = f.getAll('diasSemana').map(Number);
            const repetir = state.editando ? 1 : Math.min(parseInt(f.get('repetir')) || 1, frequencia === 'semanal' ? 52 : 24);
            if (frequencia === 'semanal' && diasSemana.length === 0) {
                alert('Escolha pelo menos um dia da semana para repetir.');
                return;
            }
            const valor = parseFloat(f.get('valor'));
            const dataInput = f.get('data'); // Formato YYYY-MM-DD
            let nomeBase = ""; let imagem = state.tempImagem || state.editando?.imagem; 
            let categoria = state.catSelecionada;
            let pago = state.editando?.pago || false;
            let historicoPagamentos = state.editando?.historicoPagamentos || [];
            
            if (state.tipoLancamento === 'conta') {
                nomeBase = f.get('nome');
            } else if (state.tipoLancamento === 'cartao') {
                const obj = state.dados.cartoes.find(c => c.id === state.itemSelecionadoId);
                nomeBase = `Fatura ${obj.banco}`;
                imagem = null; categoria = obj.categoria || 'cartao_credito';
            } else if (state.tipoLancamento === 'fixa') {
                const obj = state.dados.fixas.find(fx => fx.id === state.itemSelecionadoId);
                nomeBase = obj.nome;
                imagem = null; categoria = obj.categoria || 'casa';
            }
            
            let novas = [...state.dados.contas];
            if (state.editando) novas = novas.filter(x => x.id !== state.editando.id);
            const baseId = Date.now();
            const paraISO = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;

            // Monta a lista de datas
            const datas = [];
            const inicio = new Date(dataInput + 'T12:00:00');
            if (frequencia === 'semanal') {
                const d = new Date(inicio);
                let guarda = 0;
                while (datas.length < repetir && guarda < 400) {
                    if (diasSemana.includes(d.getDay())) datas.push(paraISO(d));
                    d.setDate(d.getDate() + 1);
                    guarda++;
                }
            } else {
                const diaOriginal = inicio.getDate();
                for (let i = 0; i < repetir; i++) {
                    const ano = inicio.getFullYear();
                    const mes = inicio.getMonth() + i;
                    const ultimoDia = new Date(ano, mes + 1, 0).getDate();
                    datas.push(paraISO(new Date(ano, mes, Math.min(diaOriginal, ultimoDia), 12)));
                }
            }
            const total = datas.length;
            const grupoId = state.editando?.grupoId || (total > 1 ? String(baseId) : null);

            datas.forEach((dataFormatada, i) => {
                novas.push({
                    id: `${baseId}-${i}`,
                    nome: total > 1 ? `${nomeBase} (${i+1}/${total})` : nomeBase,
                    valor, 
                    data: dataFormatada,
                    pago: pago,
                    historicoPagamentos: historicoPagamentos,
                    categoria, 
                    // foto só no 1º lançamento da série (economiza espaço no banco)
                    imagem: i === 0 ? (imagem || null) : null, 
                    grupoId,
                    tipo: state.tipoLancamento,
                    cartaoId: state.tipoLancamento === 'cartao' ? state.itemSelecionadoId : null,
                    fixaId: state.tipoLancamento === 'fixa' ? state.itemSelecionadoId : null
                });
            });
            
            state.dados.contas = novas;
            closeModal(); 
            await salvarFirebase();
        };

        window.handleSalvarDespesaDiaria = async (e) => {
            e.preventDefault();
            const f = new FormData(e.target);
            const valor = parseFloat(f.get('valor'));
            const dataInput = f.get('data');
            const descricao = f.get('descricao');
            const subcategoriaId = f.get('subcategoriaId');
            const pagoPorId = f.get('pagoPorId') || idUsuarioLogado() || null;
            const naoInformadoDD = pagoPorId === 'nao_informado';
            const usuarioPagou = naoInformadoDD ? null : (state.dados.usuarios || []).find(u => String(u.id) === String(pagoPorId));
            
            if (!subcategoriaId) {
                alert("Selecione uma subcategoria!");
                return;
            }
            
            let novas = [...state.dados.contas];
            if (state.editando) novas = novas.filter(x => x.id !== state.editando.id);
            
            const novaDespesa = {
                id: state.editando?.id || Date.now().toString(),
                nome: descricao,
                descricao: descricao,
                valor, 
                data: dataInput,
                pago: true, // Despesa diária sempre considerada paga
                historicoPagamentos: [{ id: Date.now().toString(), valor, data: new Date().toISOString(), pagoPorId: naoInformadoDD ? 'nao_informado' : (usuarioPagou?.id || null), pagoPorNome: naoInformadoDD ? 'Não informado' : (usuarioPagou?.nome || null) }],
                categoria: 'despesa_diaria', // Categoria bloqueada
                subcategoriaId: subcategoriaId, // NOVO: subcategoria
                imagem: null, // Sem thumbnail
                tipo: 'despesa_diaria', // Tipo específico
                cartaoId: null,
                fixaId: null
            };
            
            novas.push(novaDespesa);
            state.dados.contas = novas;
            
            // Feedback de sucesso
            state.feedback = { ativo: true, frase: "Despesa diária registrada com sucesso!" };
            render();
            await salvarFirebase();
            
            setTimeout(() => { 
                state.feedback.ativo = false; 
                closeModal();
                render();
            }, 1500);
        };

        window.openModalPagar = (id) => { state.editando = state.dados.contas.find(x => x.id === id); state.modal = 'pagar'; render(); };
        window.togglePagarBtn = (val) => {
            const btn = document.getElementById('btn-confirmar-pagamento');
            if (parseFloat(val) > 0) { btn.disabled = false; btn.classList.replace('bg-white/5', 'bg-[#CCFF00]'); btn.classList.replace('text-white/10', 'text-black'); }
            else { btn.disabled = true; btn.classList.replace('bg-[#CCFF00]', 'bg-white/5'); btn.classList.replace('text-black', 'text-white/10'); }
        };

        window.handleConfirmarPagamento = async () => {
            const valor = parseFloat(document.getElementById('pagamento-input').value);
            const usuarioId = document.querySelector('input[name="pagamento-usuario"]:checked')?.value || idUsuarioLogado() || null;
            const naoInformado = usuarioId === 'nao_informado';
            const usuarioPagou = naoInformado ? null : (state.dados.usuarios || []).find(u => String(u.id) === String(usuarioId));
            const frase = FRASES_ALIVIO[Math.floor(Math.random() * FRASES_ALIVIO.length)];
            state.dados.contas = state.dados.contas.map(c => {
                if (c.id === state.editando.id) {
                    const hist = [...(c.historicoPagamentos || []), { id: Date.now().toString(), valor, data: new Date().toISOString(), pagoPorId: naoInformado ? 'nao_informado' : (usuarioPagou?.id || null), pagoPorNome: naoInformado ? 'Não informado' : (usuarioPagou?.nome || null) }];
                    return { ...c, historicoPagamentos: hist, pago: hist.reduce((a,b)=>a+b.valor,0) >= c.valor };
                }
                return c;
            });
            state.feedback = { ativo: true, frase };
            render(); await salvarFirebase();
            setTimeout(() => { state.feedback.ativo = false; state.modal = null; render(); }, 2000);
        };

        window.excluirPagamentoParcial = async (pagamentoId) => {
            try {
                if (!state.editando) return;

                // Encontrar e atualizar a conta diretamente no array state.dados.contas
                const contaIndex = state.dados.contas.findIndex(c => c.id === state.editando.id);
                if (contaIndex === -1) return;

                // Criar cópia atualizada da conta com o pagamento removido
                let contaAtualizada = { ...state.dados.contas[contaIndex] };
                contaAtualizada.historicoPagamentos = contaAtualizada.historicoPagamentos || [];
                
                // CORREÇÃO CRÍTICA: Filtrar corretamente removendo o pagamento pelo ID
                contaAtualizada.historicoPagamentos = contaAtualizada.historicoPagamentos.filter(p => p.id !== pagamentoId);
                
                // Recalcular se a conta está paga
                const totalPago = contaAtualizada.historicoPagamentos.reduce((soma, p) => soma + p.valor, 0);
                contaAtualizada.pago = totalPago >= contaAtualizada.valor;

                // Atualizar a conta no array original
                state.dados.contas[contaIndex] = contaAtualizada;
                
                // Atualizar também o state.editando para refletir no modal
                state.editando = contaAtualizada;

                // Salvar no Firebase
                await salvarFirebase();
                
                // Re-renderizar a interface
                render();
            } catch (error) {
                console.error("Erro ao excluir pagamento parcial:", error);
                alert("Erro ao excluir pagamento parcial. Tente novamente.");
            }
        };

        window.openModalCartao = () => { state.modal = 'cartao'; state.corSelecionada = CORES_ESTILO[0]; render(); };
        window.editCartao = (id) => { state.editando = state.dados.cartoes.find(x => x.id === id); state.corSelecionada = state.editando.cor || CORES_ESTILO[0]; state.modal = 'cartao'; render(); };
        window.handleSalvarCartao = async (e) => {
            e.preventDefault();
            const f = new FormData(e.target);
            const lembrar = f.get('lembrarSemLancamento') === 'on';
            const novo = { 
                id: state.editando?.id || Date.now().toString(), 
                banco: f.get('banco'), 
                titular: f.get('titular'), 
                diaFatura: parseInt(f.get('diaFatura')), 
                imagem: state.tempImagem || state.editando?.imagem, 
                cor: state.corSelecionada, 
                categoria: f.get('categoria'),
                lembrarSemLancamento: lembrar
            };
            if (state.editando) state.dados.cartoes = state.dados.cartoes.map(x => x.id === novo.id ? novo : x);
            else state.dados.cartoes.push(novo);
            closeModal(); await salvarFirebase();
        };

        window.openModalFixa = () => { state.modal = 'fixa'; render(); };
        window.editFixa = (id) => { state.editando = state.dados.fixas.find(x => x.id === id); state.modal = 'fixa'; render(); };
        window.handleSalvarFixa = async (e) => {
            e.preventDefault();
            const f = new FormData(e.target);
            const lembrar = f.get('lembrarSemLancamento') === 'on';
            const novo = { 
                id: state.editando?.id || Date.now().toString(), 
                nome: f.get('nome'), 
                diaVencimento: parseInt(f.get('diaVencimento')), 
                categoria: f.get('categoria'), 
                imagem: state.tempImagem || state.editando?.imagem,
                lembrarSemLancamento: lembrar
            };
            if (state.editando) state.dados.fixas = state.dados.fixas.map(x => x.id === novo.id ? novo : x);
            else state.dados.fixas.push(novo);
            closeModal(); await salvarFirebase();
        };

        window.confirmDelete = (id, tipo) => { state.itemExcluir = { id, tipo }; state.modal = 'excluir'; render(); };
        window.handleConfirmExcluir = async () => {
            const { id, tipo } = state.itemExcluir;
            if (tipo === 'conta') state.dados.contas = state.dados.contas.filter(x => x.id !== id);
            else if (tipo === 'cartao_db') state.dados.cartoes = state.dados.cartoes.filter(x => x.id !== id);
            else if (tipo === 'fixa') state.dados.fixas = state.dados.fixas.filter(x => x.id !== id);
            else if (tipo === 'usuario') state.dados.usuarios = (state.dados.usuarios || []).filter(x => x.id !== id);
            closeModal(); await salvarFirebase();
        };

        window.editConta = (id) => {
            const c = state.dados.contas.find(x => x.id === id);
            state.editando = c; 
            state.tipoLancamento = c.tipo || 'conta'; 
            state.catSelecionada = c.categoria || 'outros';
            state.itemSelecionadoId = c.cartaoId || c.fixaId || ''; 
            state.passoLancamento = 'formulario'; 
            state.modal = 'lancamento';
            
            // Se for despesa diária, usar formulário específico
            if (c.tipo === 'despesa_diaria') {
                state.tipoLancamento = 'despesa_diaria';
                state.catSelecionada = 'despesa_diaria';
            }
            
            render();
        };
        window.editContaFromModal = (id) => { state.modal = null; setTimeout(() => editConta(id), 100); };
        window.triggerFile = (id) => document.getElementById(`file-${id}`).click();
        window.processFile = (e, target) => {
            const file = e.target.files[0]; if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                const img = new Image(); img.src = ev.target.result;
                img.onload = () => {
                    const canvas = document.createElement('canvas'); canvas.width = 120; canvas.height = 120;
                    canvas.getContext('2d').drawImage(img, 0, 0, 120, 120);
                    state[target] = canvas.toDataURL('image/jpeg', 0.5); render();
                };
            };
            reader.readAsDataURL(file);
        };
        window.setCorCartao = (id) => { state.corSelecionada = CORES_ESTILO.find(c => c.id === id); render(); };

        // --- AVISO DE GRAVAÇÃO NO BANCO (fica fora do #root, então não some no render) ---
        function mostrarToastSalvamento(status, msg) {
            let el = document.getElementById('toast-salvamento');
            if (!el) {
                el = document.createElement('div');
                el.id = 'toast-salvamento';
                document.body.appendChild(el);
            }
            const estilos = {
                salvando: { bg: '#1A1A1A', cor: '#FFFFFF', icone: 'fa-circle-notch fa-spin', borda: 'rgba(255,255,255,0.15)' },
                sucesso:  { bg: '#CCFF00', cor: '#000000', icone: 'fa-circle-check', borda: '#CCFF00' },
                aviso:    { bg: '#FF9800', cor: '#000000', icone: 'fa-triangle-exclamation', borda: '#FF9800' },
                erro:     { bg: '#FF4444', cor: '#FFFFFF', icone: 'fa-circle-xmark', borda: '#FF4444' }
            };
            const s = estilos[status] || estilos.salvando;
            el.style.cssText = `position:fixed; top:calc(env(safe-area-inset-top, 0px) + 16px); left:50%; transform:translateX(-50%); z-index:2000; background:${s.bg}; color:${s.cor}; border:1px solid ${s.borda}; padding:12px 18px; border-radius:18px; display:flex; align-items:center; gap:10px; font-family:Inter,sans-serif; font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:0.05em; box-shadow:0 10px 30px rgba(0,0,0,0.3); max-width:90vw;`;
            el.innerHTML = `<i class="fa-solid ${s.icone}" style="font-size:14px; flex-shrink:0;"></i><span>${msg}</span>`;
            clearTimeout(el._timer);
            if (status !== 'salvando') {
                el._timer = setTimeout(() => el.remove(), status === 'sucesso' ? 2500 : 7000);
            }
        }

        async function salvarFirebase() {
            if (!state.user) {
                mostrarToastSalvamento('erro', 'Sem conexão com o banco. Recarregue o app e tente de novo.');
                return false;
            }
            const ref = doc(db, 'apps', APP_ID, 'dados', 'financeiro');

            // Remove imagens duplicadas: contas de cartão/fixa usam a imagem do cadastro
            state.dados.contas = (state.dados.contas || []).map(c => {
                if (c.imagem && (c.cartaoId || c.fixaId)) {
                    const { imagem, ...resto } = c;
                    return { ...resto, imagem: null };
                }
                return c;
            });

            // Limpa campos "undefined" (ex: conta sem imagem) — o Firebase recusa gravar se existir algum
            const payload = JSON.parse(JSON.stringify({ ...state.dados, lastUpdate: Date.now() }));
            const tamanhoKB = Math.round(new Blob([JSON.stringify(payload)]).size / 1024);

            mostrarToastSalvamento('salvando', 'Gravando no banco...');
            const avisoLento = setTimeout(() => {
                mostrarToastSalvamento('salvando', 'Sem internet? Vai gravar quando conectar...');
            }, 8000);

            try {
                await setDoc(ref, payload, { merge: true });
                clearTimeout(avisoLento);
                if (tamanhoKB > 870) {
                    mostrarToastSalvamento('aviso', `Gravado! Atenção: banco ${Math.round(tamanhoKB / 1024 * 100)}% cheio (${tamanhoKB} KB de 1024 KB)`);
                } else {
                    mostrarToastSalvamento('sucesso', 'Gravado no banco de dados');
                }
                return true;
            } catch (e) {
                clearTimeout(avisoLento);
                console.error("Erro ao salvar:", e, `Tamanho: ${tamanhoKB} KB`);
                const texto = String(e?.message || e?.code || e);
                let msg = `Não gravou! ${texto}`;
                if (/size|exceeds|too large/i.test(texto)) {
                    msg = `Não gravou! Banco cheio (${tamanhoKB} KB, limite 1024 KB)`;
                } else if (/permission/i.test(texto)) {
                    msg = 'Não gravou! Sem permissão no banco de dados';
                }
                mostrarToastSalvamento('erro', msg);
                return false;
            }
        }

        const init = async () => {
            onAuthStateChanged(auth, u => {
                if (u) {
                    state.user = u;
                    const ref = doc(db, 'apps', APP_ID, 'dados', 'financeiro');
                    onSnapshot(ref, snap => {
                        if (snap.exists()) {
                            const d = snap.data();
                            state.dados = {
                                contas: Array.isArray(d?.contas) ? d.contas : [],
                                cartoes: Array.isArray(d?.cartoes) ? d.cartoes.map(c => ({ ...c, lembrarSemLancamento: c.lembrarSemLancamento || false })) : [],
                                fixas: Array.isArray(d?.fixas) ? d.fixas.map(f => ({ ...f, lembrarSemLancamento: f.lembrarSemLancamento || false })) : [],
                                usuarios: Array.isArray(d?.usuarios) ? d.usuarios : usuariosPadrao,
                                subcategoriasGastos: Array.isArray(d?.subcategoriasGastos) ? d.subcategoriasGastos : SUBCATEGORIAS_PADRAO // NOVO: carregar subcategorias
                            };
                            
                            // Verificar se há usuário lembrado para login automático
                            const rememberedUser = JSON.parse(localStorage.getItem('financeiro_remembered_user') || 'null');
                            if (rememberedUser) {
                                const found = state.dados.usuarios.find(u => u.id === rememberedUser.id);
                                if (found) {
                                    state.isLogged = true;
                                    state.currentUser = found;
                                }
                            }
                            
                            render();
                        }
                    });
                } else { signInAnonymously(auth); }
            });
        };
        init();
    </script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/meu-app-financeiro/service-worker.js');
  });
}
</script>
